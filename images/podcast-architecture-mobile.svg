<title id="t">Podcast recommendation platform architecture</title>
<desc id="d">Content and behaviour pipelines feed a hybrid ranking stored in MongoDB and shown in a Streamlit dashboard; Airflow orchestrates all jobs. Each box links to its source code.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  <style>
    .lane{font-size:14.5px;font-weight:700;letter-spacing:.06em}
    .h{font-size:15px;font-weight:600;fill:#111827}
    .s{font-size:12.5px;fill:#4b5563}
    .ln{stroke:#6b7280;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .col{font-size:11px;fill:#9ca3af;font-weight:600;letter-spacing:.08em}
    .ext{font-size:12.5px;fill:#9ca3af}
    a.node{cursor:pointer}
    a.node .box{transition:stroke-width .15s, filter .15s}
    a.node:hover .box, a.node:focus .box{stroke-width:2.8;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
    a.node:hover .ext, a.node:focus .ext{fill:#111827}
    a.node.solid .h{fill:#fff} a.node.solid .s{fill:#fffbeb} a.node.solid .ext{fill:#fde68a}
  </style></defs>
