<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Podcast recommendation platform architecture</title>
  <desc id="d">Two pipelines, content and user behaviour, feed a hybrid ranking stored in MongoDB and shown in a Streamlit dashboard. Airflow orchestrates everything.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .lane{font-size:13px;font-weight:700;letter-spacing:.06em}
      .h{font-size:13.5px;font-weight:600;fill:#111827}
      .s{font-size:11.5px;fill:#4b5563}
      .ln{stroke:#6b7280;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .col{font-size:11px;fill:#9ca3af;font-weight:600;letter-spacing:.08em}
    </style>
  </defs>
  <rect width="1240" height="530" fill="#ffffff"/>

  <!-- column headers -->
  <g class="col" text-anchor="middle">
    <text x="90" y="22">SOURCE</text><text x="256" y="22">TRANSPORT</text><text x="422" y="22">PROCESS</text>
    <text x="588" y="22">LAKE</text><text x="754" y="22">MODEL</text><text x="920" y="22">RESULTS</text>
    <text x="1125" y="22">SERVING</text>
  </g>

  <!-- lane backgrounds -->
  <rect x="10" y="34" width="990" height="104" rx="12" fill="#ecfdf5"/>
  <rect x="10" y="204" width="990" height="104" rx="12" fill="#f5f3ff"/>
  <text x="22" y="52" class="lane" fill="#047857">A · CONTENT PIPELINE — what an episode is about</text>
  <text x="22" y="222" class="lane" fill="#6d28d9">B · BEHAVIOUR PIPELINE — what users actually do</text>

  <!-- lane A nodes -->
  <g stroke="#10b981" stroke-width="1.4" fill="#ffffff">
    <rect x="20" y="62" width="140" height="64" rx="9"/><rect x="186" y="62" width="140" height="64" rx="9"/>
    <rect x="352" y="62" width="140" height="64" rx="9"/><rect x="518" y="62" width="140" height="64" rx="9" stroke-dasharray="5 3"/>
    <rect x="684" y="62" width="140" height="64" rx="9"/><rect x="850" y="62" width="140" height="64" rx="9" stroke-dasharray="5 3"/>
  </g>
  <g text-anchor="middle">
    <text x="90" y="89" class="h">PodcastIndex API</text><text x="90" y="107" class="s">trending episodes</text>
    <text x="256" y="89" class="h">Kafka</text><text x="256" y="107" class="s">episode-metadata</text>
    <text x="422" y="89" class="h">Vosk STT</text><text x="422" y="107" class="s">audio → transcript</text>
    <text x="588" y="89" class="h">Delta Lake</text><text x="588" y="107" class="s">transcripts · vectors</text>
    <text x="754" y="89" class="h">Embeddings + KNN</text><text x="754" y="107" class="s">MiniLM · top-k cosine</text>
    <text x="920" y="89" class="h">MongoDB</text><text x="920" y="107" class="s">similarities</text>
  </g>

  <!-- lane B nodes -->
  <g stroke="#8b5cf6" stroke-width="1.4" fill="#ffffff">
    <rect x="20" y="232" width="140" height="64" rx="9"/><rect x="186" y="232" width="140" height="64" rx="9"/>
    <rect x="352" y="232" width="140" height="64" rx="9"/><rect x="518" y="232" width="140" height="64" rx="9" stroke-dasharray="5 3"/>
    <rect x="684" y="232" width="140" height="64" rx="9"/><rect x="850" y="232" width="140" height="64" rx="9" stroke-dasharray="5 3"/>
  </g>
  <g text-anchor="middle">
    <text x="90" y="259" class="h">Event simulator</text><text x="90" y="277" class="s">play · like · skip</text>
    <text x="256" y="259" class="h">Kafka</text><text x="256" y="277" class="s">user-events</text>
    <text x="422" y="259" class="h">Spark Streaming</text><text x="422" y="277" class="s">weight + aggregate</text>
    <text x="588" y="259" class="h">Delta Lake</text><text x="588" y="277" class="s">user × episode daily</text>
    <text x="754" y="259" class="h">Spark ML · ALS</text><text x="754" y="277" class="s">implicit feedback</text>
    <text x="920" y="259" class="h">MongoDB</text><text x="920" y="277" class="s">als_top_n</text>
  </g>

  <!-- lane arrows -->
  <g class="ln">
    <path d="M160,94 H184"/><path d="M326,94 H350"/><path d="M492,94 H516"/><path d="M658,94 H682"/><path d="M824,94 H848"/>
    <path d="M160,264 H184"/><path d="M326,264 H350"/><path d="M492,264 H516"/><path d="M658,264 H682"/><path d="M824,264 H848"/>
  </g>

  <!-- serving column -->
  <rect x="1030" y="138" width="190" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="1125" y="164" text-anchor="middle" class="h">Hybrid ranking</text>
  <text x="1125" y="183" text-anchor="middle" class="s">0.7 · ALS + 0.3 · similarity</text>
  <text x="1125" y="201" text-anchor="middle" class="s">top-N per user</text>

  <rect x="1030" y="250" width="190" height="60" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="1125" y="276" text-anchor="middle" class="h">MongoDB</text>
  <text x="1125" y="294" text-anchor="middle" class="s">final_recommendations</text>

  <rect x="1030" y="356" width="190" height="64" rx="10" fill="#f59e0b"/>
  <text x="1125" y="384" text-anchor="middle" class="h" fill="#ffffff" style="fill:#fff">Streamlit dashboard</text>
  <text x="1125" y="402" text-anchor="middle" class="s" style="fill:#fffbeb">recs + live analytics</text>

  <rect x="518" y="356" width="140" height="64" rx="9" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
  <text x="588" y="384" text-anchor="middle" class="h">DuckDB</text>
  <text x="588" y="402" text-anchor="middle" class="s">SQL on Delta, no Spark</text>

  <g class="ln">
    <path d="M990,94 C1010,94 1012,160 1028,162"/>
    <path d="M990,264 C1010,264 1012,196 1028,194"/>
    <path d="M1125,216 V248"/>
    <path d="M1125,310 V354"/>
    <path d="M588,296 V354"/>
    <path d="M658,388 H1028"/>
  </g>

  <!-- orchestration -->
  <rect x="20" y="452" width="1200" height="52" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="40" y="476" class="h">Apache Airflow</text>
  <text x="40" y="494" class="s">orchestrates DAGs: new_episodes · user_events · recommendation · demo   —   everything runs in Docker Compose</text>
  <g font-size="11" fill="#6b7280">
    <rect x="900" y="469" width="22" height="14" rx="3" fill="#fff" stroke="#6b7280" stroke-dasharray="4 2"/>
    <text x="930" y="480">= storage</text>
    <rect x="1010" y="469" width="22" height="14" rx="3" fill="#fff" stroke="#6b7280"/>
    <text x="1040" y="480">= compute / service</text>
  </g>
</svg>
